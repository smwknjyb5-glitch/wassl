 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصل استلام</title>
 <meta property="og:image" content="https://smwknjyb5-glitch.github.io/wassl/wassl.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="صورة تطبيق  لوصل الاستلام ">
<style>
:root{--navy:#14213d;--gold:#c9a227;--bg:#f4f1e8;--ink:#1b1b1b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:12px}
.bar{max-width:800px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
button.gold{background:var(--gold);color:var(--navy);font-weight:700}
.paper{max-width:800px;margin:0 auto;background:#fff;border:2px solid var(--navy);border-radius:6px;padding:24px}
h1{margin:0 0 4px;text-align:center;color:var(--navy);font-size:28px}
.line{height:3px;background:var(--gold);margin:8px auto 18px;width:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px}
label{display:block;font-size:13px;color:#555;margin-bottom:2px}
input,textarea{width:100%;font:inherit;padding:7px 8px;border:1px solid #bbb;border-radius:6px;background:#fff}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--navy);padding:4px;text-align:center}
th{background:var(--navy);color:#fff;font-weight:600;padding:8px}
td input{border:0;text-align:center;padding:6px 2px}
td.n{width:40px}td.q{width:70px}td.x{width:40px;border:0}
.del{background:#a33;padding:4px 9px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;text-align:center}
.sign div{border-top:1px dashed #777;padding-top:6px;min-height:80px}
.note{font-size:13px;color:#555;margin-top:10px;text-align:center}
.print-only{display:none}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;padding:0}
 .bar,.x,.addrow{display:none!important}
 .paper{border:2px solid #000;max-width:none;border-radius:0}
 input,textarea{border:0!important;padding:2px}
 th{background:#14213d!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
 <button class="gold" onclick="window.print()">🖨️ طباعة</button>
 <button onclick="addRow()">➕ إضافة وثيقة</button>
 <button onclick="resetAll()">↺ وصل جديد</button>
</div>
<div class="paper">
 <h1>وصل استلام  </h1><div class="line"></div>
 <div class="grid">
  <div><label>رقم الوصل</label><input id="no" placeholder="مثال: 001"></div>
  <div><label>تاريخ الاستلام</label><input type="date" id="date"></div>
  <div><label>اسم المستلِم / الجهة المستلمة</label><input id="receiver"></div>
  <div><label>اسم المودِع (صاحب الوثائق)</label><input id="giver"></div>
 </div>
 <p>استلمتُ أنا الموقّع أدناه من السيد(ة) <b id="gv">........</b> الوثائق المبيّنة في الجدول الآتي، وذلك بتاريخ <b id="dt">........</b>:</p>
 <table>
  <thead><tr><th>الرقم</th><th>بيان الوثيقة</th><th>العدد</th><th>ملاحظات</th><th class="x"></th></tr></thead>
  <tbody id="rows"></tbody>
 </table>
 <button class="addrow" onclick="addRow()">➕ إضافة سطر</button>
 <div style="margin-top:12px"><label>ملاحظات عامة</label><textarea id="notes" rows="2"></textarea></div>
 <div class="sign"><div>توقيع المستلِم</div><div>توقيع المودِع</div></div>
 <div class="note">يُحرَّر هذا الوصل من نسختين، نسخة لكل طرف.</div>
</div>
<script>
const rows=document.getElementById('rows');
function fmt(d){if(!d)return'........';const[y,m,da]=d.split('-');return da+'/'+m+'/'+y}
function renum(){[...rows.children].forEach((tr,i)=>tr.querySelector('.n').textContent=i+1)}
function addRow(v){
 const tr=document.createElement('tr');
 tr.innerHTML='<td class="n"></td><td><input value="'+(v||'')+'"></td><td class="q"><input type="number" min="1" value="1"></td><td><input></td><td class="x"><button class="del" onclick="this.closest(\'tr\').remove();renum()">✕</button></td>';
 rows.appendChild(tr);renum();
}
function sync(){document.getElementById('dt').textContent=fmt(date.value);document.getElementById('gv').textContent=giver.value||'........'}
function resetAll(){rows.innerHTML='';['no','receiver','giver','notes'].forEach(i=>document.getElementById(i).value='');date.valueAsDate=new Date();for(let i=0;i<4;i++)addRow();sync()}
date.addEventListener('input',sync);giver.addEventListener('input',sync);
resetAll();
</script>
</body>
</html>
