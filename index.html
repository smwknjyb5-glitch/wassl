<!DOCTYPE html>  
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وصل استلام</title>
<meta property="og:image" content="https://smwknjyb5-glitch.github.io/wassl/wassl.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="صورة تطبيق لوصل الاستلام">
<style>
:root{--navy:#14213d;--gold:#c9a227;--bg:#f4f1e8;--ink:#1b1b1b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:12px}
.bar{max-width:800px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:10px 16px;border:0;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer}
button.gold{background:var(--gold);color:var(--navy);font-weight:700}
button.green{background:#2e7d4f}
.paper{max-width:800px;margin:0 auto;background:#fff;border:2px solid var(--navy);border-radius:6px;padding:24px}
h1{margin:0 0 4px;text-align:center;color:var(--navy);font-size:28px}
.line{height:3px;background:var(--gold);margin:8px auto 18px;width:120px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:16px}
label{display:block;font-size:13px;color:#555;margin-bottom:2px}
input,textarea{width:100%;font:inherit;padding:7px 8px;border:1px solid #bbb;border-radius:6px;background:#fff}
table{width:100%;border-collapse:collapse;margin:8px 0}
th,td{border:1px solid var(--navy);padding:4px;text-align:center}
th{background:var(--navy);color:#fff;font-weight:600;padding:8px}
td input{border:0;text-align:center;padding:6px 2px}
td.n{width:40px}td.q{width:70px}td.x{width:40px;border:0}
.del{background:#a33;padding:4px 9px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px;text-align:center}
.sign div{border-top:1px dashed #777;padding-top:6px;min-height:80px}
.note{font-size:13px;color:#555;margin-top:10px;text-align:center}
.saved{max-width:800px;margin:12px auto 0;background:#fff;border:2px solid var(--gold);border-radius:6px;padding:14px;display:none}
.saved h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e5e5;padding:8px 0;flex-wrap:wrap}
.item span{flex:1;min-width:160px}
.item button{padding:6px 12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;padding:0}
 .bar,.x,.addrow,.saved,.toast{display:none!important}
 .paper{border:2px solid #000;max-width:none;border-radius:0}
 input,textarea{border:0!important;padding:2px}
 th{background:#14213d!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
 <button class="gold" onclick="window.print()">🖨️ طباعة</button>
 <button class="green" onclick="saveReceipt()">💾 حفظ الوصل</button>
 <button onclick="toggleSaved()">📂 الوصولات المحفوظة (<span id="cnt">0</span>)</button>
 <button onclick="addRow()">➕ إضافة وثيقة</button>
 <button onclick="resetAll()">↺ وصل جديد</button>
</div>

<div class="paper">
 <h1>وصل استلام</h1><div class="line"></div>
 <div class="grid">
  <div><label>رقم الوصل</label><input id="no" placeholder="مثال: 001"></div>
  <div><label>تاريخ الاستلام</label><input type="date" id="date"></div>
  <div><label>وقت الاستلام (التوقيت)</label><input type="time" id="time"></div>
  <div><label>اسم المستلِم / الجهة المستلمة</label><input id="receiver"></div>
  <div><label>اسم المودِع (صاحب الوثائق)</label><input id="giver"></div>
 </div>
 <p>استلمتُ أنا الموقّع أدناه من السيد(ة) <b id="gv">........</b> الوثائق المبيّنة في الجدول الآتي، وذلك بتاريخ <b id="dt">........</b> على الساعة <b id="tm">........</b>:</p>
 <table>
  <thead><tr><th>الرقم</th><th>بيان الوثيقة</th><th>العدد</th><th>ملاحظات</th><th class="x"></th></tr></thead>
  <tbody id="rows"></tbody>
 </table>
 <button class="addrow" onclick="addRow()">➕ إضافة سطر</button>
 <div style="margin-top:12px"><label>ملاحظات عامة</label><textarea id="notes" rows="2"></textarea></div>
 <div class="sign"><div>توقيع المستلِم</div><div>توقيع المودِع</div></div>
 <div class="note">يُحرَّر هذا الوصل من نسختين، نسخة لكل طرف.</div>
</div>

<div class="saved" id="savedBox">
 <h2>الوصولات المحفوظة</h2>
 <div id="savedList"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const rows=$('rows');
const LIST_KEY='wassl_list', DRAFT_KEY='wassl_draft';

/* ---------- تخزين آمن ---------- */
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* ---------- أدوات ---------- */
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(d){if(!d)return'........';const[y,m,da]=d.split('-');return da+'/'+m+'/'+y}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function renum(){[...rows.children].forEach((tr,i)=>tr.querySelector('.n').textContent=i+1)}

function addRow(v){
 v=v||{};
 const tr=document.createElement('tr');
 tr.innerHTML='<td class="n"></td><td><input class="d"></td><td class="q"><input class="c" type="number" min="1"></td><td><input class="o"></td><td class="x"><button class="del">✕</button></td>';
 tr.querySelector('.d').value=v.d||'';
 tr.querySelector('.c').value=v.q||1;
 tr.querySelector('.o').value=v.o||'';
 tr.querySelector('.del').onclick=()=>{tr.remove();renum();draft()};
 rows.appendChild(tr);renum();
}

function sync(){
 $('dt').textContent=fmt($('date').value);
 $('tm').textContent=$('time').value||'........';
 $('gv').textContent=$('giver').value||'........';
}

/* ---------- الحالة ---------- */
function getState(){
 return{
  no:$('no').value,date:$('date').value,time:$('time').value,
  receiver:$('receiver').value,giver:$('giver').value,notes:$('notes').value,
  rows:[...rows.children].map(tr=>({d:tr.querySelector('.d').value,q:tr.querySelector('.c').value,o:tr.querySelector('.o').value}))
 };
}
function setState(s){
 $('no').value=s.no||'';$('date').value=s.date||'';$('time').value=s.time||'';
 $('receiver').value=s.receiver||'';$('giver').value=s.giver||'';$('notes').value=s.notes||'';
 rows.innerHTML='';
 (s.rows&&s.rows.length?s.rows:[{},{},{},{}]).forEach(addRow);
 sync();
}

/* ---------- مسودة تلقائية ---------- */
let t;
function draft(){sync();clearTimeout(t);t=setTimeout(()=>lsSet(DRAFT_KEY,getState()),300)}
document.addEventListener('input',draft);

/* ---------- حفظ الوصولات ---------- */
function saveReceipt(){
 const s=getState();
 const list=lsGet(LIST_KEY,[]);
 const key=s.no.trim();
 const i=key?list.findIndex(x=>x.state.no.trim()===key):-1;
 const rec={id:i>=0?list[i].id:Date.now(),savedAt:new Date().toISOString(),state:s};
 if(i>=0){
  if(!confirm('يوجد وصل محفوظ بنفس الرقم. هل تريد استبداله؟'))return;
  list[i]=rec;
 }else list.unshift(rec);
 if(lsSet(LIST_KEY,list)){toast('✔ تم حفظ الوصل');renderSaved()}
 else toast('تعذّر الحفظ في هذا المتصفح');
}
function renderSaved(){
 const list=lsGet(LIST_KEY,[]);
 $('cnt').textContent=list.length;
 const box=$('savedList');box.innerHTML='';
 if(!list.length){box.textContent='لا توجد وصولات محفوظة بعد.';return}
 list.forEach(r=>{
  const s=r.state;
  const div=document.createElement('div');div.className='item';
  const sp=document.createElement('span');
  sp.textContent='رقم: '+(s.no||'—')+' | المودِع: '+(s.giver||'—')+' | '+fmt(s.date)+' '+(s.time||'');
  const o=document.createElement('button');o.textContent='فتح';
  o.onclick=()=>{setState(s);lsSet(DRAFT_KEY,s);window.scrollTo({top:0,behavior:'smooth'});toast('تم فتح الوصل')};
  const d=document.createElement('button');d.textContent='حذف';d.style.background='#a33';
  d.onclick=()=>{if(!confirm('حذف هذا الوصل المحفوظ؟'))return;lsSet(LIST_KEY,lsGet(LIST_KEY,[]).filter(x=>x.id!==r.id));renderSaved()};
  div.append(sp,o,d);box.appendChild(div);
 });
}
function toggleSaved(){
 const b=$('savedBox');
 b.style.display=b.style.display==='block'?'none':'block';
 if(b.style.display==='block')b.scrollIntoView({behavior:'smooth'});
}

/* ---------- وصل جديد ---------- */
function resetAll(){
 if(!confirm('بدء وصل جديد؟ (تأكد من حفظ الوصل الحالي)'))return;
 setState({date:today(),time:nowTime()});
 lsSet(DRAFT_KEY,getState());
}

/* ---------- البدء ---------- */
const dr=lsGet(DRAFT_KEY,null);
if(dr)setState(dr);else setState({date:today(),time:nowTime()});
renderSaved();
</script>
</body>
</html>
